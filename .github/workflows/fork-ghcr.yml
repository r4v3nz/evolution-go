# Fork change (r4v3nz/evolution-go): publishes the fail-closed build to GHCR.
name: Fork image (GHCR)

on:
  push:
    branches: [fail-closed-proxy]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Fail-closed proxy tests
        run: go test -count=1 ./pkg/whatsmeow/service/ ./pkg/user/service/ -run 'TestResolveProxyAddress|TestWebVersionCheckGoesThroughProxy|TestRejectedProxyPasswordIsDetected|TestProxyRetryBackoff|TestShouldRetryProxy|TestProxyUnavailableSignal|TestFailedWhatsAppCheckIsAnError|TestStuckClientHelpers'

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION 2>/dev/null || echo 0.0.0)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/evolution-go:fail-closed
            ghcr.io/${{ github.repository_owner }}/evolution-go:${{ steps.version.outputs.version }}-fail-closed
            ghcr.io/${{ github.repository_owner }}/evolution-go:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Evolution Go (unofficial fork): proxy fails closed
          build-args: |
            VERSION=${{ steps.version.outputs.version }}-fail-closed
          cache-from: type=gha
          cache-to: type=gha,mode=max
