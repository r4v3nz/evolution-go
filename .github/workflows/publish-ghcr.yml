name: Build and publish Evolution GO

on:
  push:
    branches:
      - fail-closed-proxy
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: evolution-go-image-fail-closed
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=v0.7.2-fail-closed.${{ github.sha }}
          tags: |
            ghcr.io/r4v3nz/evolution-go:fail-closed
            ghcr.io/r4v3nz/evolution-go:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/r4v3nz/evolution-go
            org.opencontainers.image.revision=${{ github.sha }}
